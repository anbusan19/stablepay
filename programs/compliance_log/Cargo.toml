[package]
name    = "compliance-log"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "compliance_log"

[features]
no-entrypoint   = []
no-idl          = []
no-log-ix-name  = []
cpi             = ["no-entrypoint"]
idl-build       = ["anchor-lang/idl-build"]
default         = []

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }
