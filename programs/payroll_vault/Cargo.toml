[package]
name    = "payroll-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "payroll_vault"

[features]
no-entrypoint   = []
no-idl          = []
no-log-ix-name  = []
cpi             = ["no-entrypoint"]
idl-build       = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default         = []

[dependencies]
anchor-lang = "0.30.0"
anchor-spl  = { version = "0.30.0", features = ["token", "associated_token"] }
